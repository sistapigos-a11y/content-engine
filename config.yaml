# =============================================================
#  إعدادات السيستام — بدّل هنا برك، ما تحتاجش تمس الكود
# =============================================================

# package = السيستام يكتب السكريبت ويصنع الصوت برك، والمونتاج والنشر تديرهم أنت في الـ PC
# full    = كلش أوتوماتيكي (مونتاج Remotion + نشر)
output: package

channel:
  audience: "Curious viewers 16-40 who love football, internet culture and storytelling documentaries"
  tone: "cinematic, suspenseful, factual, confident narrator"

  # أنواع المحتوى: كل يوم يختار واحد على حساب الـ weight (الاحتمال)
  formats:
    trending_person:
      weight: 2   # 2 من 3 أيام: قصص شخصيات مشهورة حالياً
      description: >
        Story documentaries about people trending RIGHT NOW on social media: footballers,
        athletes, streamers, YouTubers, rappers, influencers. Titles like 'Nobody Believed',
        'X Warned Us 3 Years Ago', 'X Was Right All Along', 'The Rise of X'.
    mystery:
      weight: 1   # 1 من 3 أيام: النيش القديم
      description: "Unsolved mysteries, forgotten history and strange true stories"

  # منين يجيب "شكون رايح ترند اليوم"
  trending:
    wikipedia: ["en", "es"]               # أكثر الصفحات مشاهدة البارح
    google_trends_geos: ["US", "GB", "MX", "ES", "AR"]

# اللغات اللي يتنتج بيهم كل موضوع
languages:
  en: {}
  es: {}

# ---------------- الصوت (نسخة من صوتك) ----------------
voice:
  # chatterbox = مجاني، ينسخ صوتك من تسجيل 10-30 ثانية (assets/voice/me.wav)
  # elevenlabs = مدفوع، أسرع وأطبع (يحتاج ELEVENLABS_API_KEY + ELEVENLABS_VOICE_ID)
  # edge       = صوت مايكروسوفت مجاني (ماشي صوتك) — احتياط
  provider: "chatterbox"
  fallback: "edge"
  exaggeration: 0.5    # 0.3 هادي ← 0.8 حماسي
  cfg_weight: 0.5      # أقل = أبطأ وأوضح
  temperature: 0.7
  best_of: 5           # كل جملة تتولّد حتى 5 مرات، Whisper يسمعها ونخليو الأحسن
  min_match: 0.92      # إذا التطابق مع النص وصل لهذا، نوقفو (ما نزيدوش محاولات)
  elevenlabs_model: "eleven_multilingual_v2"
  edge_voices:
    en: {voice: "en-US-AndrewMultilingualNeural", rate: "-5%"}
    es: {voice: "es-MX-JorgeNeural", rate: "-3%"}

# ---------------- الكتابة ----------------
# gemini (مجاني) | groq (مجاني) | anthropic (مدفوع)
# يجرّب بالترتيب: إذا موديل مشغول ولا ماكانش، يروح للي موراه
llm:
  chain:
    - [gemini, gemini-3.8-flash]
    - [gemini, gemini-flash-latest]
    - [gemini, gemini-3-flash-preview]
    - [gemini, gemini-3.5-flash-lite]
    - [groq, llama-3.3-70b-versatile]

long_video:
  enabled: true
  target_minutes: 20
  sections: 8
  burn_subtitles: false   # الطويل: الترجمة تترفع كملف SRT

shorts:
  enabled: true
  per_video: 3
  max_seconds: 55

quality:
  min_score: 7
  max_rewrites: 2

# ---------------- المونتاج (Remotion: video/) ----------------
style:
  accent: "#e50914"       # اللون الرئيسي (أحمر كيما الثمبنيلات اللي بعثتهم)
  chapter_label: {en: "CHAPTER", es: "CAPÍTULO"}

media:
  sources: ["pexels", "pixabay"]   # لقطات b-roll مجانية
  clip_max_seconds: 6
  music_volume: 0.07               # حط mp3 بلا حقوق في assets/music

# ---------------- النشر ----------------
publish:
  youtube: true
  tiktok: true
  instagram: true
  facebook: true
  # حد يوتيوب: 10,000 وحدة/يوم وكل رفع = 1,600 ← طويل + شورت واحد لكل لغة = 6,400 ✅
  # (الشورتس الأخرى تروح لـ TikTok / Instagram / Facebook عادي)
  youtube_shorts_per_video: 1
  youtube_privacy: "public"   # public | unlisted | private
  youtube_category: "24"      # 24 = Entertainment, 27 = Education, 17 = Sports
  ai_disclosure: true         # يوتيوب يطلب الإفصاح على الصوت المولّد
