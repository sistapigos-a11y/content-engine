# =============================================================
#  إعدادات السيستام — بدّل هنا برك، ما تحتاجش تمس الكود
# =============================================================

channel:
  # موضوع القناة (النيش). كلما كان محدد أكثر، المحتوى يكون أحسن
  niche: "Unsolved mysteries, forgotten history and strange true stories"
  # الجمهور المستهدف والأسلوب
  audience: "Curious adults 18-45 who love storytelling documentaries"
  tone: "cinematic, suspenseful, factual, calm narrator voice"

# اللغات: كل لغة = نسخة كاملة (فيديو طويل + شورتس)
languages:
  en:
    voice: "en-US-AndrewMultilingualNeural"   # صوت مجاني من Microsoft Edge
    rate: "-5%"
  es:
    voice: "es-MX-JorgeNeural"
    rate: "-3%"

# مزوّد الذكاء الاصطناعي للكتابة: gemini (مجاني) | groq (مجاني) | anthropic (مدفوع)
llm:
  provider: "gemini"
  model: "gemini-2.5-flash"
  fallback_provider: "groq"
  fallback_model: "llama-3.3-70b-versatile"

long_video:
  enabled: true
  target_minutes: 20          # المدة المستهدفة
  sections: 8                 # عدد الفصول (كل فصل ~ 2.5 دقيقة)
  burn_subtitles: false       # الطويل: الترجمة تترفع كملف SRT (أحسن للـ SEO)

shorts:
  enabled: true
  per_video: 3                # كم شورت يتولد من كل موضوع (لكل لغة)
  max_seconds: 55

# جودة: السكريبت يتقيّم أوتوماتيكياً، وإذا النقطة أقل من هذي يتعاود يتكتب
quality:
  min_score: 7
  max_rewrites: 2

media:
  # مصادر الفيديوهات/الصور المجانية (حط المفاتيح في secrets)
  sources: ["pexels", "pixabay"]
  clip_max_seconds: 7         # كل لقطة ما تفوتش هاذ المدة (إيقاع المونتاج)
  music_volume: 0.08          # حط ملفات mp3 بلا حقوق في assets/music

publish:
  # نشر أوتوماتيكي ولا لا لكل منصة
  youtube: true
  tiktok: true
  instagram: true
  facebook: true
  # قنوات يوتيوب: كل لغة عندها refresh token خاص (secret)
  # حد يوتيوب: 10,000 وحدة/يوم وكل رفع = 1,600 ← طويل + شورت واحد لكل لغة = 6,400 ✅
  # (الشورتس الأخرى تروح لـ TikTok / Instagram / Facebook عادي)
  youtube_shorts_per_video: 1
  youtube_privacy: "public"   # public | unlisted | private
  youtube_category: "27"      # 27 = Education
  # يوتيوب يطلب الإفصاح على المحتوى المولّد بالذكاء الاصطناعي
  ai_disclosure: true
