name: Daily content

on:
  schedule:
    - cron: "17 13 * * *"   # every day 13:17 UTC (afternoon in the US / Latin America)
  workflow_dispatch:
    inputs:
      mode:
        description: "full | no-publish | quick"
        default: "full"

concurrency:
  group: content-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Produce and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_EN: ${{ secrets.TIKTOK_REFRESH_TOKEN_EN }}
          TIKTOK_REFRESH_TOKEN_ES: ${{ secrets.TIKTOK_REFRESH_TOKEN_ES }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          META_TOKEN_EN: ${{ secrets.META_TOKEN_EN }}
          META_TOKEN_ES: ${{ secrets.META_TOKEN_ES }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_USER_ID_ES: ${{ secrets.IG_USER_ID_ES }}
          FB_PAGE_ID_EN: ${{ secrets.FB_PAGE_ID_EN }}
          FB_PAGE_ID_ES: ${{ secrets.FB_PAGE_ID_ES }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          case "$MODE" in
            no-publish) python run.py --no-publish ;;
            quick)      python run.py --quick --no-publish ;;
            *)          python run.py ;;
          esac

      - name: Save topic history
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update content history [skip ci]"
          git push || true

      - name: Keep videos for 7 days (download from the Actions tab)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            work/*/*/*.mp4
            work/*/*/*.jpg
            work/*/*/*.srt
            work/*/job.json
          retention-days: 7
          if-no-files-found: ignore
